<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regression Run Comparator</title><style>body{font-family:system-ui;margin:20px;max-width:1100px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ddd;padding:5px}input{margin:8px}.bad{background:#fee}.diff{background:#fff4cc}</style><h1>iPhone / Android Run Comparator</h1><p>同じsuiteの2つのrunner JSONを選択してください。</p><input id="a" type="file" accept="application/json"><input id="b" type="file" accept="application/json"><div id="out"></div><script>
const $=s=>document.querySelector(s),read=f=>new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>{try{res(JSON.parse(r.result))}catch(e){rej(e)}};r.onerror=rej;r.readAsText(f)});async function go(){if(!$('#a').files[0]||!$('#b').files[0])return;const [a,b]=await Promise.all([read($('#a').files[0]),read($('#b').files[0])]),ma=new Map(a.cases.map(x=>[x.corpusId+'|'+x.file,x])),mb=new Map(b.cases.map(x=>[x.corpusId+'|'+x.file,x])),keys=[...new Set([...ma.keys(),...mb.keys()])].sort(),rows=[];let diffs=0;for(const k of keys){const x=ma.get(k),y=mb.get(k),same=x&&y&&x.verdict===y.verdict&&JSON.stringify(x.fields)===JSON.stringify(y.fields)&&JSON.stringify(x.reviewState)===JSON.stringify(y.reviewState);if(!same)diffs++;rows.push(`<tr class="${same?'':'diff'}"><td>${k}</td><td>${x?.verdict||'missing'}</td><td>${y?.verdict||'missing'}</td><td>${same?'same':'DIFF'}</td></tr>`)}$('#out').innerHTML=`<h2>差分 ${diffs}/${keys.length}</h2><p>A: ${a.environment?.deviceGate||''}<br>B: ${b.environment?.deviceGate||''}</p><table><tr><th>case</th><th>A</th><th>B</th><th>compare</th></tr>${rows.join('')}</table>`}$('#a').onchange=go;$('#b').onchange=go;
</script>
